name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .    # <--- editable mode installation

    - name: Run tests, dataset checks and benchmarks
      run: |
        pytest -q
        pytest -vv tests/test_boundary_precision.py
        python -m boxsolver.entrypoints.cli --boxes data/boxes.json --items data/items.json
        python -m boxsolver.entrypoints.cli --boxes data/SemiRealistic/boxes.json --items data/SemiRealistic/items.json --json > semirealistic-result.json
        python -c "import json; result = json.load(open('semirealistic-result.json')); assert result['Success']; assert result['Summary']['PackedItemCount'] == 115; assert not result['UnpackedItems']"
        python tests/benchmark.py